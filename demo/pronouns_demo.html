<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pronouns demo</title>
<style>
  :root {
    --bg: #000; --text: #fff; --fix: rgb(192,192,192);
    --correct: rgb(153,229,153); --incorrect: rgb(240,128,128); --timeout: rgb(96,96,96);
    --muted: #8a8a8a; --line: #333;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
  body { font: 22px/1.5 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .screen { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; }
  .screen.on { display: flex; }
  .text { max-width: 720px; padding: 24px 16px; text-align: center; }
  .text p { margin: 0 0 1em; }
  #page .text { text-align: left; }  /* instruction pages, as in the program */
  .menu { display: inline-block; text-align: left; }
  .next { color: var(--muted); font-size: 16px; margin-top: 2.5em; }
  .en { color: var(--muted); font-size: 15px; margin-top: 2em; }
  kbd { border: 1px solid var(--muted); border-radius: 4px; padding: 0 6px; font-family: inherit; }
  .example { display: flex; align-items: center; justify-content: center; gap: 28px; margin: 1.2em 0; }
  .example img { width: 150px; height: 150px; }
  .example .w { font: 32pt Inconsolata, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
  .example .arrow { color: var(--muted); font-size: 32px; }
  /* No mouse cursor on any screen (instructions and trials), except the results. */
  html, body, .screen { cursor: none; }
  #end, #end * { cursor: auto; }
  #end button { cursor: pointer; }
  #picture { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: none; }
  /* --s side, --t line width, --o black outline (0 for the main task's cross) */
  #cross { position: absolute; left: 50%; top: 50%; --s: 16px; --t: 2px; --o: 0px; --c: var(--fix);
           width: var(--s); height: var(--s); margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2);
           background:
             linear-gradient(var(--c), var(--c)) center / var(--t) calc(100% - 2 * var(--o)) no-repeat,
             linear-gradient(var(--c), var(--c)) center / calc(100% - 2 * var(--o)) var(--t) no-repeat,
             linear-gradient(#000, #000) center / calc(var(--t) + 2 * var(--o)) 100% no-repeat,
             linear-gradient(#000, #000) center / 100% calc(var(--t) + 2 * var(--o)) no-repeat; }
  #dot { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px;
         border-radius: 50%; display: none; z-index: 1; }
  #word { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center;
          font: 38.4pt Inconsolata, Menlo, Consolas, "DejaVu Sans Mono", monospace; white-space: nowrap; }
  #end { overflow-y: auto; align-items: flex-start; }
  #end .text { max-width: 900px; }
  table { border-collapse: collapse; margin: 1.5em auto 0; font-size: 15px; text-align: left; }
  th, td { padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: normal; }
  td .tr { color: var(--muted); }
  .ok { color: var(--correct); } .bad { color: var(--incorrect); } .none { color: var(--timeout); }
  /* The MEG instruction screens (key 0): a 16:9 black screen with the program's
     proportions (text 13/270 of the height, lines at most 55% wide, pad 140/270,
     examples 95/270). */
  #meg { flex-direction: column; gap: 14px; }
  #megBox { --h: min(52vw, 80vh); position: relative; width: calc(var(--h) * 16 / 9); height: var(--h);
            border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center;
            justify-content: center; text-align: center;
            font: calc(var(--h) * 13 / 270) / 1.35 Inconsolata, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
  #megBox .txt { max-width: 55%; text-align: left; }  /* lines left-aligned, block centred */
  #megBox p { margin: 0 0 0.6em; }
  #megBox img.pad { height: calc(var(--h) * 140 / 270); margin-top: calc(var(--h) * 0.03); }
  #megBox img.ex { height: calc(var(--h) * 95 / 270); margin-top: calc(var(--h) * 0.03); }
  #megInfo { color: var(--muted); font-size: 15px; text-align: center; }
  button { font: inherit; font-size: 18px; margin-top: 1.5em; padding: 8px 18px; background: #222; color: var(--text);
           border: 1px solid var(--muted); border-radius: 6px; cursor: pointer; }
</style>
</head>
<body>

<div id="page" class="screen on"><div class="text" id="pageText"></div></div>

<div id="meg" class="screen"><div id="megBox"></div><div id="megInfo"></div></div>

<div id="stage" class="screen"><img id="picture" alt=""><div id="word"></div><div id="cross"></div><div id="dot"></div></div>

const MEG_SCREENS = [{"title": "Main task (first part): opening screens", "text": "Bienvenue !\n\nCette expérience comporte deux parties.", "image": ""}, {"title": "Main task (first part): opening screens", "text": "Dans la première partie, vous allez lire des phrases, mot par mot.", "image": ""}, {"title": "… or, when no localizer follows", "text": "Bienvenue !\n\nVous allez lire des phrases, mot par mot.", "image": ""}, {"title": "Main task instructions (natural = right for every subject)", "text": "Les phrases vont par deux et décrivent une petite scène.\n\nReprésentez-vous cette scène au fil de la lecture.", "image": ""}, {"title": "Main task instructions (natural = right for every subject)", "text": "Puis jugez : cette scène a-t-elle du sens ?", "image": ""}, {"title": "Main task instructions (natural = right for every subject)", "text": "Bouton vert de droite : ça a du sens.\n\nBouton vert de gauche : ça n'a pas de sens.", "image": "pad_congruent_right"}, {"title": "Main task instructions (natural = right for every subject)", "text": "Ne réfléchissez pas trop : lisez le plus naturellement possible et répondez vite, en moins de 3 secondes.\n\nVous pouvez répondre dès que le dernier mot apparaît.", "image": ""}, {"title": "Main task instructions (natural = right for every subject)", "text": "La croix devient verte si votre réponse est correcte, rouge si elle est incorrecte.\n\nElle devient gris foncé si vous n'avez pas répondu à temps.", "image": ""}, {"title": "Main task instructions (natural = right for every subject)", "text": "Gardez les yeux au centre de l'écran et évitez de cligner des yeux pendant la lecture.", "image": ""}, {"title": "Then, before the training block", "text": "Commençons par un court entraînement.\n\nDites-nous quand vous souhaitez commencer.", "image": ""}, {"title": "Before main block 1 (after training)", "text": "Fin de l'entraînement.\n\nReposez-vous quelques instants.\n\nRappel : gardez les yeux sur la croix au centre de l'écran.", "image": "pad_congruent_right"}, {"title": "… or, without training (-block 1), right after the instructions", "text": "Dites-nous quand vous souhaitez commencer.", "image": ""}, {"title": "Pause before main blocks 2-6", "text": "Pause : bloc 1 sur 6 terminé.\n\nReposez-vous quelques instants.\n\nRappel : gardez les yeux sur la croix au centre de l'écran.", "image": "pad_congruent_right"}, {"title": "Localizer (second part): first screen, after the main task", "text": "Fin de la première partie.\n\nDans la seconde partie, des mots et des images vont apparaître au centre de l'écran, l'un après l'autre.\n\nMots et images alternent, au rythme d'un par seconde.", "image": ""}, {"title": "… or, when the main task was skipped", "text": "Bienvenue !\n\nDes mots et des images vont apparaître au centre de l'écran, l'un après l'autre.\n\nMots et images alternent, au rythme d'un par seconde.", "image": ""}, {"title": "Localizer instructions, before the first localizer block", "text": "Votre tâche : repérer quand ce qui apparaît correspond à ce qui vient juste avant.", "image": ""}, {"title": "Localizer instructions, before the first localizer block", "text": "Cela marche dans les deux sens.\n\nUn mot suivi de son image :", "image": "example_word_picture"}, {"title": "Localizer instructions, before the first localizer block", "text": "Et aussi une image suivie de son mot :", "image": "example_picture_word"}, {"title": "Localizer instructions, before the first localizer block", "text": "Dans les deux cas, appuyez le plus vite possible sur le bouton vert de droite.", "image": "pad_localizer"}, {"title": "Localizer instructions, before the first localizer block", "text": "Si ce qui apparaît ne correspond pas à ce qui précède, n'appuyez pas.", "image": ""}, {"title": "Localizer instructions, before the first localizer block", "text": "Si vous avez appuyé à raison, la croix devient verte (sur un mot, un point vert apparaît).\n\nSi vous avez appuyé à tort, ou oublié d'appuyer, elle devient rouge (ou un point rouge apparaît).", "image": ""}, {"title": "Localizer instructions, before the first localizer block", "text": "Gardez les yeux au centre de l'écran, sur les mots comme sur les images.", "image": ""}, {"title": "Then, before the training block", "text": "Commençons par un court entraînement.", "image": ""}, {"title": "Before localizer block 1 (after training)", "text": "Fin de l'entraînement.\n\nAppuyez sur le bouton vert de droite quand ce qui apparaît correspond à ce qui précède, dans un sens comme dans l'autre.", "image": "pad_localizer"}, {"title": "Before localizer block 2", "text": "Pause : reposez-vous quelques instants.\n\nRappel : bouton vert de droite quand un mot et une image se correspondent, dans un sens comme dans l'autre.", "image": "pad_localizer"}, {"title": "End", "text": "L'expérience est terminée.\n\nMerci pour votre participation !", "image": ""}];

function show(id) {
  for (const s of document.querySelectorAll(".screen")) s.classList.toggle("on", s.id === id);
}

let aborted = false;
window.addEventListener("keydown", e => { if (e.key === "Escape") aborted = true; });

// Shows the pages one by one; SPACE goes to the next. Resolves after the last.
function pages(list) {
  return new Promise(resolve => {
    let i = 0;
    show("page");
    $("pageText").innerHTML = list[0];
    const onKey = e => {
      if (e.key === "Escape") { window.removeEventListener("keydown", onKey); resolve(false); return; }
      if (e.code !== "Space") return;
      e.preventDefault();
      if (++i < list.length) { $("pageText").innerHTML = list[i]; return; }
      window.removeEventListener("keydown", onKey);
      resolve(true);
    };
    window.addEventListener("keydown", onKey);
  });
}

// Shows the menu; resolves with the parts to run once 1, 2 or 3 is pressed.
function menu() {
  return new Promise(resolve => {
    show("page");
    $("pageText").innerHTML = MENU;
    const onKey = e => {
      if (!(e.key in PARTS)) return;
      window.removeEventListener("keydown", onKey);
      resolve(PARTS[e.key]);
    };
    window.addEventListener("keydown", onKey);
  });
}

// The MEG program's instruction screens, in session order, as the participant
// sees them (key 0 in the menu): → or SPACE next, ← back, ESC back to the menu.
function browseScreens() {
  return new Promise(resolve => {
    let i = 0;
    const draw = () => {
      const sc = MEG_SCREENS[i];
      let html = '<div class="txt">' + sc.text.split("\n\n").map(p => `<p>${p}</p>`).join("") + "</div>";
      if (sc.image) html += `<img class="${sc.image.startsWith("pad_") ? "pad" : "ex"}" src="${MEG_PICTURES[sc.image]}" alt="">`;
      $("megBox").innerHTML = html;
      $("megInfo").innerHTML = `${i + 1} / ${MEG_SCREENS.length} · ${sc.title}<br>` +
        `<kbd>→</kbd> or <kbd>espace</kbd> next · <kbd>←</kbd> back · <kbd>Esc</kbd> menu`;
    };
    const onKey = e => {
      if (e.key === "Escape") { window.removeEventListener("keydown", onKey); resolve(); return; }
      if (e.key === "ArrowRight" || e.code === "Space") {
        e.preventDefault();
        if (i + 1 < MEG_SCREENS.length) { i++; draw(); }
        else { window.removeEventListener("keydown", onKey); resolve(); }
      } else if (e.key === "ArrowLeft" && i > 0) { i--; draw(); }
    };
    show("meg");
    draw();
    window.addEventListener("keydown", onKey);
  });
}

// Pictures are as wide as the longest noun in the word font, as in the program.
function pictureWidth() {
  const ctx = document.createElement("canvas").getContext("2d");
  ctx.font = getComputedStyle(wordEl).font;
  return Math.ceil(Math.max(...NOUNS.map(n => ctx.measureText(n).width)));
}

// The localizer: one stream of 32 stimuli, each on for a full second. → on a
// match turns the feedback green; → on a non-match, or no press on a match
// within 800 ms, turns it red until the next stimulus. The feedback is the
// cross on a picture, a small dot at the centre of a word.
function runLocalizer() {
  return new Promise(resolve => {
    const width = pictureWidth();
    picture.style.width = picture.style.height = width + "px";
    // The cross on the pictures: 1.92 cm, as in the program, where the
    // pictures are 8 degrees wide at 104 cm (14.55 cm).
    const crossPx = Math.round(width * 1.92 / 14.55);
    cross.style.setProperty("--s", crossPx + "px");
    const crossT = Math.max(2, Math.floor(crossPx / 20));
    cross.style.setProperty("--t", crossT + "px");
    cross.style.setProperty("--o", Math.max(1, Math.floor(crossT / 2)) + "px");  // black outline
    const out = LOC_TRIALS.map(() => ({ press: null, outcome: null }));
    let start = null, cur = -1;
    const feedback = color => {
      if (LOC_TRIALS[cur].modality === "word") { dot.style.background = color; dot.style.display = "block"; }
      else cross.style.setProperty("--c", color);
    };

    const onKey = e => {
      if (e.key !== "ArrowRight" || start === null || cur < 0) return;
      const o = out[cur], t = LOC_TRIALS[cur];
      if (o.press !== null) return;
      o.press = performance.now() - start - cur * LOC_SOA;
      if (!t.match) { o.outcome = "false_alarm"; feedback(COLORS.incorrect); }
      else if (o.outcome === "miss") o.outcome = "late";
      else { o.outcome = "hit"; feedback(COLORS.correct); }
    };
    window.addEventListener("keydown", onKey);

    const frame = now => {
      if (start === null) start = now;
      const el = now - start, i = Math.floor(el / LOC_SOA);
      if (aborted || i >= LOC_TRIALS.length) {
        window.removeEventListener("keydown", onKey);
        wordEl.textContent = ""; picture.style.display = "none"; dot.style.display = "none";
        cross.style.visibility = "visible";
        cross.style.removeProperty("--s"); cross.style.removeProperty("--t"); cross.style.removeProperty("--o");
        resolve(aborted ? null : out);
        return;
      }
      if (i !== cur) {  // next stimulus: no feedback, white cross on a picture
        cur = i;
        cross.style.setProperty("--c", LOC_FIX);
        dot.style.display = "none";
        const t = LOC_TRIALS[i];
        if (t.modality === "word") { wordEl.textContent = t.item; picture.style.display = "none"; }
        else { wordEl.textContent = ""; picture.src = IMAGES[t.item]; picture.style.display = "block"; }
        cross.style.visibility = t.modality === "word" ? "hidden" : "visible";
      }
      const within = el - i * LOC_SOA, o = out[i];
      if (LOC_TRIALS[i].match && o.press === null && o.outcome === null && within >= LOC_DEADLINE) {
        o.outcome = "miss";
        feedback(COLORS.incorrect);
      }
      requestAnimationFrame(frame);
    };
    cross.style.setProperty("--c", LOC_FIX);
    requestAnimationFrame(frame);
  });
}

// The words of a pronoun trial with their onsets, in ms from the trial's start.
function schedule(t) {
  const words = [];
  const add = (sentence, start) => sentence.replace(/\.$/, "").split(/\s+/)
    .forEach((w, i) => words.push({ text: w, onset: start + i * (ON + OFF) }));
  add(t.sentence1, FIX);
  add(t.sentence2, FIX + 6 * (ON + OFF) + BREAK);
  return words;
}

// Runs one pronoun trial; resolves with the answer ("left", "right" or "") and
// its RT from the last word's onset. Presses count from that onset; the trial
// ends when the word has gone off and there is an answer, or 3 s after that.
function runTrial(t) {
  return new Promise(resolve => {
    const words = schedule(t);
    const respOpen = words[words.length - 1].onset, wordOff = respOpen + ON;
    let start = null, shown = null, answer = null;

    const onKey = e => {
      if (!(e.key in KEYS) || start === null) return;
      // Presses before the last word appears are ignored, as in the MEG version.
      // performance.now(), not e.timeStamp: some browsers stamp key events on
      // another clock than requestAnimationFrame, and the press is then lost.
      const now = performance.now();
      if (now - start >= respOpen && answer === null) answer = { key: KEYS[e.key], t: now };
    };
    window.addEventListener("keydown", onKey);

    const frame = now => {
      if (start === null) start = now;
      const el = now - start;
      if (aborted) {
        window.removeEventListener("keydown", onKey);
        wordEl.textContent = "";
        resolve(null);
        return;
      }
      if (el >= wordOff && (answer !== null || el >= wordOff + RESPONSE)) {
        window.removeEventListener("keydown", onKey);
        // Answered during the last word: the word goes and the feedback cross
        // takes its place, so the cross must be made visible here.
        wordEl.textContent = "";
        cross.style.visibility = "visible";
        resolve(answer ? { key: answer.key, rt: answer.t - start - respOpen } : { key: "", rt: null });
        return;
      }
      const w = words.find(w => el >= w.onset && el < w.onset + ON);
      const text = w ? w.text : "";
      if (text !== shown) {
        wordEl.textContent = text;
        cross.style.visibility = text ? "hidden" : "visible";
        shown = text;
      }
      requestAnimationFrame(frame);
    };
    cross.style.setProperty("--c", COLORS.fix);
    requestAnimationFrame(frame);
  });
}

const wait = ms => new Promise(r => setTimeout(r, ms));

async function run() {
  aborted = false;
  let loc = null;
  const results = [];
  const parts = await menu();
  if (parts.screens) {
    await browseScreens();
    return run();
  }
  document.documentElement.requestFullscreen?.().catch(() => {});
  let go = true; // false once ESC was pressed
  if (parts.pronoun) {
    go = await pages(PRONOUN_PAGES(parts.loc));
    if (go) {
      show("stage");
      for (const t of TRIALS) {
        const r = await runTrial(t);
        if (r === null) { go = false; break; }
        const outcome = r.key === "" ? "timeout" : r.key === t.correct_key ? "correct" : "incorrect";
        results.push({ t, ...r, outcome });
        cross.style.setProperty("--c", COLORS[outcome]);
        await wait(FEEDBACK);
        cross.style.setProperty("--c", COLORS.fix);
        await wait(ITI);
      }
    }
  }
  if (go && parts.loc && await pages(LOC_PAGES(parts.pronoun))) {
    show("stage");
    loc = await runLocalizer();
  }
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  finish(loc, results);
}

function finish(loc, results) {
  if (loc) {
    const count = k => loc.filter(o => o.outcome === k).length;
    const matches = LOC_TRIALS.filter(t => t.match).length;
    $("locScore").textContent = `${results.length ? "Seconde" : "Première"} partie : ${count("hit")} correspondance(s) repérée(s) sur ${matches}, ` +
      `${count("false_alarm")} appui(s) à tort, ${count("miss") + count("late")} oubli(s).`;
  } else $("locScore").textContent = "";
  const n = results.filter(r => r.outcome === "correct").length;
  $("score").textContent = results.length ?
    `Première partie : ${n} réponse${n > 1 ? "s" : ""} correcte${n > 1 ? "s" : ""} sur ${results.length}.` : "";
  const label = { left: "← pas de sens", right: "→ du sens", "": "—" };
  document.querySelector("#end table").style.display = results.length ? "" : "none";
  $("rows").innerHTML = results.map((r, i) => `<tr>
    <td>${i + 1}</td>
    <td>${r.t.sentence1} ${r.t.sentence2}<br><span class="tr">${r.t.translation}</span></td>
    <td>${label[r.t.correct_key]}</td>
    <td class="${{ correct: "ok", incorrect: "bad", timeout: "none" }[r.outcome]}">${label[r.key]}</td>
    <td>${r.rt === null ? "—" : Math.round(r.rt) + " ms"}</td></tr>`).join("");
  show("end");
}

$("again").addEventListener("click", run);
run();
</script>
