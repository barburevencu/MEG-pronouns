# Publishes the browser demo (demo/pronouns_demo.html) on GitHub Pages, at
# https://barburevencu.github.io/MEG-pronouns/, whenever the demo changes on main.
name: demo page

on:
  push:
    branches: [main]
    paths: [demo/pronouns_demo.html, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir site
          cp demo/pronouns_demo.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
